<section class="pagina">
  <header class="pagina__cabecalho">
    <h1>{{ titulo() }}</h1>
    <p class="pagina__apoio">{{ apoio() }}</p>
  </header>

  <app-estado-catalogo>
    <ng-container *ngIf="produtos().length > 0; else semProdutos">
      <div class="ordenar">
        <label class="ordenar__rotulo" for="ordenar">Filtrar por</label>
        <div class="ordenar__caixa">
          <select id="ordenar" class="ordenar__select" (change)="mudarOrdem($event)">
            <option
              *ngFor="let o of ordenacoes; trackBy: porValor"
              [value]="o.valor"
              [selected]="o.valor === ordemAtual()"
            >
              {{ o.rotulo }}
            </option>
          </select>
        </div>
      </div>
      <p class="sr-only" role="status">Produtos ordenados por {{ rotuloDaOrdem() }}.</p>

      <app-grade-produtos [produtos]="produtos()" />
    </ng-container>

    <ng-template #semProdutos>
      <div class="vazio">
        <h2>Nenhum produto por aqui</h2>
        <p>Essa categoria não existe ou está sem produtos no momento.</p>
        <a class="btn btn--primario" routerLink="/">Ver a vitrine completa</a>
      </div>
    </ng-template>
  </app-estado-catalogo>
</section>
