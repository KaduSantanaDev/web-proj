<header class="topo">
  <div class="topo__linha">
    <a class="topo__logo" routerLink="/" aria-label="Migalha, ir para a vitrine">
      <app-logo />
    </a>

    <form class="busca" role="search" (submit)="buscar($event)" novalidate>
      <label class="sr-only" for="busca">Buscar produtos</label>
      <div
        class="busca__caixa"
        [ngClass]="{ 'busca__caixa--erro': tentouBuscar() && busca.invalid }"
      >
        <input
          id="busca"
          class="busca__input"
          type="search"
          [formControl]="busca"
          placeholder="O que você procura?"
          autocomplete="off"
          enterkeyhint="search"
          [attr.aria-invalid]="tentouBuscar() && busca.invalid ? 'true' : null"
          aria-describedby="busca-erro"
        />
        <button class="busca__ok" type="submit">OK</button>
      </div>
      <p id="busca-erro" class="busca__erro" role="alert">
        <ng-container *ngIf="tentouBuscar() && busca.invalid">
          Digite ao menos 2 letras para buscar.
        </ng-container>
      </p>
    </form>

    <nav class="conta" aria-label="Sua conta e cesta">
      <a class="conta__item" routerLink="/cesta" [attr.aria-label]="rotuloCesta()">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <path
            d="M9 13l5-8M23 13l-5-8"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
          />
          <path
            d="M3.5 13h25l-2.6 12.6a2.5 2.5 0 0 1-2.4 2H8.5a2.5 2.5 0 0 1-2.4-2Z"
            fill="var(--manteiga)"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linejoin="round"
          />
          <path
            d="M11.5 17.5v6M16 17.5v6M20.5 17.5v6"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          />
        </svg>
        <span class="conta__texto" aria-hidden="true">Cesta</span>
        <ng-container *ngFor="let n of [carrinho.quantidade()]">
          <span *ngIf="n > 0" class="conta__contador" aria-hidden="true">{{ n }}</span>
        </ng-container>
      </a>

      <ng-container *ngIf="auth.sessao() as sessao; else visitante">
        <span class="conta__ola" [attr.title]="sessao.email">Olá, {{ primeiroNome() }}</span>
        <button type="button" class="conta__item conta__sair" (click)="sair()">
          <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
            <path
              d="M13 6H7.5A2.5 2.5 0 0 0 5 8.5v15A2.5 2.5 0 0 0 7.5 26H13M20 10l6 6-6 6M26 16H12"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="conta__texto">Sair</span>
        </button>
      </ng-container>
      <ng-template #visitante>
        <a class="conta__item" routerLink="/login" aria-label="Entrar ou cadastrar">
          <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
            <circle
              cx="16"
              cy="11"
              r="5.5"
              fill="var(--manteiga)"
              stroke="currentColor"
              stroke-width="2.4"
            />
            <path
              d="M5.5 27c.8-5.6 5-8.5 10.5-8.5S25.7 21.4 26.5 27Z"
              fill="var(--manteiga)"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linejoin="round"
            />
          </svg>
          <span class="conta__texto">Entrar</span>
        </a>
      </ng-template>
    </nav>
  </div>

  <nav class="menu" aria-label="Categorias">
    <ul class="menu__lista">
      <li>
        <a
          routerLink="/"
          class="menu__link"
          [ngClass]="{ 'menu__link--ativo': categoriaAtiva() === '' }"
          [attr.aria-current]="categoriaAtiva() === '' ? 'page' : null"
        >
          Vitrine
        </a>
      </li>
      <li *ngFor="let c of catalogo.categorias(); trackBy: porSlug">
        <a
          routerLink="/"
          [queryParams]="{ categoria: c.slug }"
          class="menu__link"
          [ngClass]="{ 'menu__link--ativo': categoriaAtiva() === c.slug }"
          [attr.aria-current]="categoriaAtiva() === c.slug ? 'page' : null"
        >
          {{ c.nome }}
        </a>
      </li>
    </ul>
  </nav>
</header>
